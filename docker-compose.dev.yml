services:
  postgres:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    networks:
      - localmailer_network

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.6
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - localmailer_network

    # volumes:
    #   - localmailer-db:/var/lib/postgresql/data

# volumes:
#   localmailer-db:

networks:
  localmailer_network:
